name: build

# Builds both package formats and publishes them to a GitHub Release.
#
#   push to any branch      -> build + upload workflow artifacts (no release)
#   push a tag like v0.1.0  -> build + publish a Release named after the tag
#   manual dispatch         -> optional tag override, optional prerelease flag
#
# Two jobs because the formats need different toolchains: .ipk is assembled with
# Node alone, while .apk wants apk-tools v3, which ships in Alpine 3.23+.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Leave empty to use package.json's version."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a prerelease."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Shared validation: runs once, both builds depend on it.
  # ---------------------------------------------------------------------------
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Lua 5.1 (matches the router)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - run: npm ci

      - name: Shell scripts must be BusyBox-ash clean
        run: node scripts/lint-shell.js

      - name: Workflow shell must parse too
        run: node scripts/check-workflow-shell.js

      - name: Lua must parse under 5.1
        run: node scripts/lint-lua.js

      - name: Package checker must read every container format
        run: node scripts/check-package-formats.js

      - name: Build the view bundle
        run: npm run build:ui

      - name: Bundle must satisfy the SDK loader contract
        run: node scripts/check-bundle.js

  # ---------------------------------------------------------------------------
  # .ipk for OpenWrt 21-22 / GL.iNet firmware 3.x-4.x (opkg)
  # ---------------------------------------------------------------------------
  ipk:
    name: ipk (opkg)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Resolve version and tag
        id: rel
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Sync package version from the tag
        run: |
          set -eu
          ver="${{ steps.rel.outputs.tag }}"
          ver="${ver#v}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$ver"

      - name: Build ipk
        run: npm run build:ipk

      - name: Verify ipk contents
        run: node scripts/check-package.js dist/*.ipk

      - uses: actions/upload-artifact@v4
        with:
          name: gl-ai-agent-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          PRE: ${{ github.event.inputs.prerelease }}
        run: |
          set -eu
          notes="GL-AI助手 $(basename "$TAG")

          Built from ${GITHUB_SHA}.

          **Install (OpenWrt 21-22 / GL.iNet firmware 3.x-4.x, opkg)**
          \`\`\`
          opkg install gl-ai-agent_*_all.ipk
          \`\`\`
          Then open the router admin panel and pick **系统 -> GL-AI助手**.
          Configure your model API on that page; nothing else is required."
          if [ "${PRE:-false}" = "true" ]; then flag="--prerelease"; else flag=""; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.ipk --clobber
          else
            gh release create "$TAG" dist/*.ipk --target "$GITHUB_SHA" \
              --title "$TAG" --notes "$notes" ${flag:-}
          fi

  # ---------------------------------------------------------------------------
  # .apk for OpenWrt 24.10+ (apk-tools v3)
  # ---------------------------------------------------------------------------
  apk:
    name: apk (apk-tools v3)
    needs: validate
    runs-on: ubuntu-latest
    container: alpine:3.23
    steps:
      - name: Install build dependencies
        run: apk add --no-cache nodejs npm git github-cli tar

      - uses: actions/checkout@v4

      - run: npm ci

      - name: Toolchain versions
        run: |
          node --version
          apk --version

      - name: Resolve version and tag
        id: rel
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Sync package version from the tag
        run: |
          set -eu
          ver="${{ steps.rel.outputs.tag }}"
          ver="${ver#v}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$ver"

      - name: Build apk with real apk-tools
        run: node scripts/build-apk.js --require-apk

      # An APKv3 package is an ADB container: "ADBd" followed by deflated ADB,
      # with no gzip, zstd or ustar bytes anywhere (verified against a package
      # from the OpenWrt 25.12 feed). Nothing inside it can be read without an
      # ADB decoder, so the checks that matter are made by apk-tools itself:
      # install the package into a scratch root and assert against what landed.
      - name: Install into a scratch root (authoritative)
        run: |
          # There is no pipefail in this shell, so the status is captured before
          # the output is echoed - piping straight into tee would make a failed
          # install look like a pass.
          status=0
          sh scripts/verify-apk-install.sh dist/*.apk /tmp/apkroot "$GITHUB_WORKSPACE/apk-installed.txt" \
            > "$GITHUB_WORKSPACE/install.log" 2>&1 || status=$?
          cat "$GITHUB_WORKSPACE/install.log" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Verify apk contents
        run: |
          # Job logs need an authenticated token to fetch, but check-run
          # annotations do not - so when this fails, the reasons are echoed as
          # ::error:: lines and the installed tree as ::notice:: lines, which can
          # be read back through the API by anyone who can see the repository.
          status=0
          out="$(node scripts/check-package.js dist/*.apk --installed-root /tmp/apkroot 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" != 0 ]; then
            printf '%s\n' "$out" | grep -E '^ +- ' | head -8 | while IFS= read -r l; do
              printf '::error::%s\n' "$l"
            done
            head -6 "$GITHUB_WORKSPACE/apk-installed.txt" 2>/dev/null | while IFS= read -r l; do
              printf '::notice::installed: %s\n' "$l"
            done
          fi
          exit $status

      # When the checker cannot read a container, the next thing anyone wants is
      # its actual shape. This runs only on failure and prints everything needed
      # to diagnose it, into the log, the job summary and the annotations.
      - name: Dump apk container shape (diagnostic)
        if: failure()
        run: |
          {
            echo '## apk container shape'
            echo '```'
            node scripts/inspect-apk.js dist/*.apk 2>&1 || true
            echo
            echo '## checker output'
            node scripts/check-package.js dist/*.apk 2>&1 || true
            echo '```'
            echo '## installed tree (as apk-tools left it)'
            echo '```'
            cat "$GITHUB_WORKSPACE/apk-installed.txt" 2>/dev/null || echo '(nothing installed)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # An annotation can carry far more than the log view shows, and unlike
          # job logs it is readable without a token. So the ends of the outputs
          # that actually explain a failure are packed into a few annotations:
          # the install log's tail (where apk says what went wrong), what this
          # apk-tools build accepts, and what it thinks the package contains.
          # Newlines become "|" and % becomes %25, so each one stays a single
          # workflow command.
          pack() {
            sed -e 's/%/%25/g' | tr '\n' '|' | cut -c1-1400
          }
          printf '::error::apk --version: %s\n' "$(apk --version 2>&1 | pack)"
          printf '::error::apk add flags: %s\n' \
            "$(apk add --help 2>&1 | grep -iE 'script|--root|initdb|force|allow|network' | pack)"
          if [ -f "$GITHUB_WORKSPACE/install.log" ]; then
            printf '::error::install log tail: %s\n' "$(tail -25 "$GITHUB_WORKSPACE/install.log" | pack)"
          fi
          printf '::error::apk adbdump: %s\n' \
            "$(apk adbdump dist/*.apk 2>&1 | head -50 | pack)"
          printf '::error::apk manifest: %s\n' \
            "$(apk manifest --allow-untrusted dist/*.apk 2>&1 | head -12 | pack)"

          # The container-only view is unreadable by design, so a problem list
          # from it is noise. If a root exists, ask about that instead: those
          # problems are the ones worth reading.
          if [ -d /tmp/apkroot ]; then
            node scripts/check-package.js dist/*.apk --installed-root /tmp/apkroot 2>&1 \
              | grep -E '^ +- ' | head -6 \
              | while IFS= read -r l; do printf '::error::checker(installed): %s\n' "$l"; done
          fi
          grep -E '/rpc/gl_ai$' "$GITHUB_WORKSPACE/apk-installed.txt" 2>/dev/null \
            | while IFS= read -r l; do printf '::notice::rpc object: %s\n' "$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: gl-ai-agent-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          PRE: ${{ github.event.inputs.prerelease }}
        run: |
          set -eu
          git config --global --add safe.directory '*'
          notes="GL-AI助手 $(basename "$TAG") — apk build

          Built from ${GITHUB_SHA} with apk-tools v3.

          **Install (OpenWrt 24.10+, apk)**
          \`\`\`
          apk add --allow-untrusted gl-ai-agent-*.apk
          \`\`\`
          Then open the router admin panel and pick **系统 -> GL-AI助手**."
          if [ "${PRE:-false}" = "true" ]; then flag="--prerelease"; else flag=""; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" \
              --title "$TAG" --notes "$notes" ${flag:-} \
              || gh release upload "$TAG" dist/*.apk --clobber
          fi
